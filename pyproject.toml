[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sionna-channel-tutorial"
version = "0.1.0"
description = "Readable NumPy/CuPy prototypes for 3GPP TR 38.901 TDL/CDL MIMO channels"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
  {name = "ThreeMonth03"},
]
dependencies = [
  "numpy>=1.26",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
cuda = ["cupy-cuda12x[ctk]>=14.1,<15"]
plot = ["matplotlib>=3.8"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.9",
  "matplotlib>=3.8",
]

[project.urls]
Repository = "https://github.com/ThreeMonth03/sionna_tutorial"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sionna_tutorial.data.models" = ["*.json.gz"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "cuda: requires a working CUDA-capable CuPy installation",
]
